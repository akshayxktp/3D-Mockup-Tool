name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Route handlers can't exist in a static export; the hosted demo
      # disables Export in the UI instead (see components/ExportDialog.tsx).
      - name: Remove server-only export API
        run: rm -rf app/api

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: '1'
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      # `enablement: true` creates the Pages site on first run and points it at
      # Actions, using the job's own `pages: write` token — so a fresh fork or
      # clone deploys without anyone visiting Settings first. Without it the
      # action only READS the Pages config and the build dies here on
      # "Get Pages site failed ... Not Found", with the export already built.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
